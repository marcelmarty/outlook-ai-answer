<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>KI-Antwort Commands</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="src/core.js"></script>
  <script>
    /* Ribbon button "Antwortvorschlag mit KI erstellen" (read mode, no task pane) */
    function notify(msg, isError) {
      const item = Office.context.mailbox.item;
      const opts = isError
        ? { type: Office.MailboxEnums.ItemNotificationMessageType.ErrorMessage, message: msg.slice(0, 250) }
        : { type: Office.MailboxEnums.ItemNotificationMessageType.InformationalMessage, message: msg.slice(0, 250), icon: "Icon.16", persistent: false };
      try { item.notificationMessages.replaceAsync("kiStatus", opts); } catch (e) { /* ignore */ }
    }

    async function quickReply(event) {
      try {
        const s = KI.loadSettings();
        if (!s.apiKey && s.provider !== "openai") {
          notify("KI-Antwort: Bitte zuerst über «KI-Antwort (Optionen)» → Einstellungen einen API-Key erfassen.", true);
          return;
        }
        notify("KI-Antwort: Antwortvorschlag wird erstellt …");
        const ctx = await KI.getMailContext();
        const text = await KI.generate(s, KI.buildPrompt(s, ctx, ""));
        KI.openReply(text, s.replyAll);
        notify("KI-Antwort: Entwurf erstellt – bitte vor dem Senden prüfen.");
      } catch (e) {
        notify("KI-Antwort Fehler: " + ((e && e.message) || e), true);
      } finally {
        event.completed();
      }
    }

    Office.onReady(() => {
      if (Office.actions && Office.actions.associate) Office.actions.associate("quickReply", quickReply);
    });
    window.quickReply = quickReply;
  </script>
</head>
<body></body>
</html>
